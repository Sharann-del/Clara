name: Feature request
description: Suggest an improvement or a new capability for Clara.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/Sharann-del/Clara/blob/main/docs/roadmap.md) and existing issues first;
        if the idea is already there, add your use case to that issue instead.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Sketches, example DSL or API shapes are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you thought about.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - Yes, I'd like to open a pull request
        - Maybe, with some guidance
        - No
    validations:
      required: true
