<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Clara</title>
  <desc id="desc">System design you can type, zoom into, and hand to Claude. Docs, diagrams as code, and AI edits you approve.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#2a2a30"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.38" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotmask">
      <rect width="1280" height="400" fill="url(#fade)"/>
    </mask>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 8 5 1 8.5z" fill="#6b6b74"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 8 5 1 8.5z" fill="#f3b65a"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="400" rx="18" fill="#0a0a0b"/>
  <rect width="1280" height="400" rx="18" fill="url(#dots)" mask="url(#dotmask)"/>

  <!-- Brand -->
  <g transform="translate(72 64)">
    <rect width="40" height="40" rx="10" fill="#19191c"/>
    <rect x="8.1" y="8.1" width="12.5" height="10" rx="2.5" fill="none" stroke="#ededef" stroke-width="2.5"/>
    <path d="M14.4 18.1v5.6a2.5 2.5 0 0 0 2.5 2.5h3.7" fill="none" stroke="#ededef" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="20.6" y="21.2" width="11.3" height="10" rx="2.5" fill="#8e98ff"/>
    <text x="56" y="28.5" fill="#ededef" font-family="'Bricolage Grotesque','Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="-0.6">clara</text>
  </g>

  <!-- Headline -->
  <g font-family="'Bricolage Grotesque','Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="50" font-weight="700" letter-spacing="-1.6" fill="#ededef">
    <text x="70" y="178">System design you can</text>
    <text x="70" y="238"><tspan fill="#8e98ff">type</tspan>, zoom into, and</text>
    <text x="70" y="298">hand to Claude.</text>
  </g>

  <!-- Tagline -->
  <text x="72" y="346" fill="#85858e" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="0.2">docs  ·  diagrams as code  ·  AI edits you approve</text>

  <!-- Diagram -->
  <g font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle">
    <!-- Edges -->
    <path d="M970 124V166" stroke="#6b6b74" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M936 226 885 286" stroke="#6b6b74" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M1004 226 1062 286" stroke="#f3b65a" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow-amber)"/>

    <!-- Web app -->
    <rect x="880" y="70" width="180" height="54" rx="11" fill="#19191c"/>
    <text x="970" y="103" fill="#ededef">Web app</text>

    <!-- Orders API (selected) -->
    <rect x="874" y="166" width="192" height="66" rx="15" fill="none" stroke="#8e98ff" stroke-width="2"/>
    <rect x="880" y="172" width="180" height="54" rx="11" fill="#222226"/>
    <text x="970" y="205" fill="#ededef">Orders API</text>
    <circle cx="874" cy="166" r="4" fill="#0a0a0b" stroke="#8e98ff" stroke-width="2"/>
    <circle cx="1066" cy="166" r="4" fill="#0a0a0b" stroke="#8e98ff" stroke-width="2"/>
    <circle cx="874" cy="232" r="4" fill="#0a0a0b" stroke="#8e98ff" stroke-width="2"/>
    <circle cx="1066" cy="232" r="4" fill="#0a0a0b" stroke="#8e98ff" stroke-width="2"/>

    <!-- Postgres -->
    <rect x="790" y="290" width="170" height="54" rx="11" fill="#19191c"/>
    <text x="875" y="323" fill="#ededef">Postgres</text>

    <!-- Redis cache (proposed) -->
    <rect x="1000" y="290" width="170" height="54" rx="11" fill="#2e2210" stroke="#a8731f" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="1085" y="323" fill="#f3b65a">Redis cache</text>

    <!-- Proposal pill -->
    <rect x="1048" y="240" width="142" height="28" rx="14" fill="#f3b65a"/>
    <text x="1119" y="259" fill="#0a0a0b" font-size="13" font-weight="700">Claude proposes</text>
  </g>

  <!-- Live cursor -->
  <g transform="translate(1046 108)">
    <path d="M0 0 0 19 5.2 14.4 8.6 22 12 20.5 8.7 13H15.5z" fill="#8e98ff" stroke="#0a0a0b" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="14" y="20" width="58" height="22" rx="6" fill="#8e98ff"/>
    <text x="43" y="35.5" fill="#0a0a0b" text-anchor="middle" font-family="'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600">you</text>
  </g>
</svg>
